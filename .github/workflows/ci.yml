name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Audit runtime dependencies
        run: python -m pip_audit --strict -r requirements.lock

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: gridlock-d:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: >-
          docker run --detach --name gridlock-d-ci --publish 8000:8000
          --env GEMINI_MODEL=ci-placeholder
          --env GEMINI_API_KEY_1=ci-placeholder
          gridlock-d:ci
      - name: Wait for health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs gridlock-d-ci
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker logs gridlock-d-ci || true
      - name: Stop container
        if: always()
        run: docker rm --force gridlock-d-ci || true
