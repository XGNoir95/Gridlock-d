name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gridlock-d:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container
        run: >-
          docker run --detach --name gridlock-d-ci --publish 8000:8000
          --env GEMINI_MODEL=ci-placeholder
          --env GEMINI_API_KEY_1=ci-placeholder
          gridlock-d:ci
      - name: Wait for health
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health | grep --quiet '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs gridlock-d-ci
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker logs gridlock-d-ci || true
      - name: Stop container
        if: always()
        run: docker rm --force gridlock-d-ci || true
